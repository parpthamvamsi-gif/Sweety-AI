name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Patch Buildozer Root Check & Build APK
      run: |
        # Patch root check prompt
        python3 -c "import buildozer; print(buildozer.__file__)" | xargs -I {} sed -i 's/self.check_root()/# self.check_root()/g' {}

        # Pre-install and link Android build-tools aidl
        yes | /root/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/root/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-31" || true

        buildozer init
        sed -i 's/android.api = 33/android.api = 31/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3==3.10.12,kivy==2.3.0,requests/' buildozer.spec

        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sweety-APK
        path: bin/*.apk
        
