name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade "cython<3.0.0" buildozer
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libncurses5-dev libncursesw5-dev xz-utils libtool autoconf automake cmake gettext pkg-config zip unzip

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/android.api = 33/android.api = 31/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3==3.10.12,kivy==2.3.0,requests/' buildozer.spec
        
        # Pre-accept all Android SDK licenses
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        printf "\n24333f8a637b3744d1006f7793024665b13c334a\n57029232ed8d41878590a9d92558d05e5d223d4d\nd56f5187479451eabf01fb78af6dfcb131a6481e\n26662a005b57703704d713832683456d3fa3001c\n33b622e747107a0b76a8700619cce0fe99811bd4\n84831b94fe7030615c6a207bafd13d2b142c013f\nf15447138131333e680a6b7d1e31e5c26b896f60" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sweety-APK
        path: bin/*.apk
